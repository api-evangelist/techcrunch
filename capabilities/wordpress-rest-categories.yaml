naftiko: 1.0.0-alpha2
info:
  label: TechCrunch WordPress REST API — Categories
  description: 'TechCrunch WordPress REST API — Categories. 2 operations. Lead operation: List Categories. Self-contained
    Naftiko capability covering one Techcrunch business surface.'
  tags:
  - Techcrunch
  - Categories
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TECHCRUNCH_API_KEY: TECHCRUNCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: wordpress-rest-categories
    baseUri: https://techcrunch.com/wp-json/wp/v2
    description: TechCrunch WordPress REST API — Categories business capability. Self-contained, no shared references.
    resources:
    - name: categories
      path: /categories
      operations:
      - name: listcategories
        method: GET
        description: List Categories
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
        - name: per_page
          in: query
          type: integer
        - name: search
          in: query
          type: string
          description: Limit results to matching a string.
        - name: orderby
          in: query
          type: string
        - name: order
          in: query
          type: string
        - name: hide_empty
          in: query
          type: boolean
          description: Whether to hide terms not assigned to any posts.
        - name: parent
          in: query
          type: integer
          description: Limit result set to terms assigned to a given parent ID.
    - name: categories-id
      path: /categories/{id}
      operations:
      - name: getcategory
        method: GET
        description: Get Category
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: wordpress-rest-categories-rest
    port: 8080
    description: REST adapter for TechCrunch WordPress REST API — Categories. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/categories
      name: categories
      description: REST surface for categories.
      operations:
      - method: GET
        name: listcategories
        description: List Categories
        call: wordpress-rest-categories.listcategories
        with:
          page: rest.page
          per_page: rest.per_page
          search: rest.search
          orderby: rest.orderby
          order: rest.order
          hide_empty: rest.hide_empty
          parent: rest.parent
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/categories/{id}
      name: categories-id
      description: REST surface for categories-id.
      operations:
      - method: GET
        name: getcategory
        description: Get Category
        call: wordpress-rest-categories.getcategory
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: wordpress-rest-categories-mcp
    port: 9090
    transport: http
    description: MCP adapter for TechCrunch WordPress REST API — Categories. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-categories
      description: List Categories
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wordpress-rest-categories.listcategories
      with:
        page: tools.page
        per_page: tools.per_page
        search: tools.search
        orderby: tools.orderby
        order: tools.order
        hide_empty: tools.hide_empty
        parent: tools.parent
      outputParameters:
      - type: object
        mapping: $.
    - name: get-category
      description: Get Category
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wordpress-rest-categories.getcategory
      outputParameters:
      - type: object
        mapping: $.
