naftiko: 1.0.0-alpha2
info:
  label: TechCrunch WordPress REST API — Authors
  description: 'TechCrunch WordPress REST API — Authors. 2 operations. Lead operation: List Authors. Self-contained Naftiko
    capability covering one Techcrunch business surface.'
  tags:
  - Techcrunch
  - Authors
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TECHCRUNCH_API_KEY: TECHCRUNCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: wordpress-rest-authors
    baseUri: https://techcrunch.com/wp-json/wp/v2
    description: TechCrunch WordPress REST API — Authors business capability. Self-contained, no shared references.
    resources:
    - name: users
      path: /users
      operations:
      - name: listusers
        method: GET
        description: List Authors
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
        - name: per_page
          in: query
          type: integer
        - name: search
          in: query
          type: string
        - name: orderby
          in: query
          type: string
        - name: order
          in: query
          type: string
        - name: who
          in: query
          type: string
          description: Limit result set to users who are considered authors.
    - name: users-id
      path: /users/{id}
      operations:
      - name: getuser
        method: GET
        description: Get Author
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: wordpress-rest-authors-rest
    port: 8080
    description: REST adapter for TechCrunch WordPress REST API — Authors. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/users
      name: users
      description: REST surface for users.
      operations:
      - method: GET
        name: listusers
        description: List Authors
        call: wordpress-rest-authors.listusers
        with:
          page: rest.page
          per_page: rest.per_page
          search: rest.search
          orderby: rest.orderby
          order: rest.order
          who: rest.who
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users/{id}
      name: users-id
      description: REST surface for users-id.
      operations:
      - method: GET
        name: getuser
        description: Get Author
        call: wordpress-rest-authors.getuser
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: wordpress-rest-authors-mcp
    port: 9090
    transport: http
    description: MCP adapter for TechCrunch WordPress REST API — Authors. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-authors
      description: List Authors
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wordpress-rest-authors.listusers
      with:
        page: tools.page
        per_page: tools.per_page
        search: tools.search
        orderby: tools.orderby
        order: tools.order
        who: tools.who
      outputParameters:
      - type: object
        mapping: $.
    - name: get-author
      description: Get Author
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wordpress-rest-authors.getuser
      outputParameters:
      - type: object
        mapping: $.
