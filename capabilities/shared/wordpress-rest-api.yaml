naftiko: "1.0.0-alpha1"

info:
  label: "TechCrunch WordPress REST API"
  description: >-
    TechCrunch exposes the standard WordPress REST API providing JSON endpoints for
    accessing posts, pages, categories, tags, authors, media, comments, and search.
    The API is public and requires no authentication for read operations.
  tags:
    - Content
    - Media
    - News
    - REST
    - WordPress
  created: "2026-05-03"
  modified: "2026-05-03"

capability:
  consumes:
    - type: http
      namespace: techcrunch-wp
      baseUri: https://techcrunch.com/wp-json/wp/v2
      description: "TechCrunch WordPress REST API - public read access"
      resources:
        - name: posts
          path: /posts
          description: "TechCrunch article and post content"
          operations:
            - name: list-posts
              method: GET
              description: "Retrieve paginated list of published TechCrunch posts"
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Items per page (max 100)"
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Full-text search query"
                - name: after
                  in: query
                  type: string
                  required: false
                  description: "Filter posts after ISO8601 date"
                - name: before
                  in: query
                  type: string
                  required: false
                  description: "Filter posts before ISO8601 date"
                - name: author
                  in: query
                  type: array
                  required: false
                  description: "Filter by author IDs"
                - name: categories
                  in: query
                  type: array
                  required: false
                  description: "Filter by category IDs"
                - name: tags
                  in: query
                  type: array
                  required: false
                  description: "Filter by tag IDs"
                - name: orderby
                  in: query
                  type: string
                  required: false
                  description: "Sort field"
                - name: order
                  in: query
                  type: string
                  required: false
                  description: "Sort direction (asc/desc)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-post
              method: GET
              description: "Retrieve a specific post by ID"
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Post ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: categories
          path: /categories
          description: "Post categories"
          operations:
            - name: list-categories
              method: GET
              description: "List all TechCrunch categories"
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Items per page"
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Search categories"
                - name: hide_empty
                  in: query
                  type: boolean
                  required: false
                  description: "Hide empty categories"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-category
              method: GET
              description: "Get a specific category"
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Category ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: tags
          path: /tags
          description: "Post tags"
          operations:
            - name: list-tags
              method: GET
              description: "List all TechCrunch tags"
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Items per page"
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Search tags"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-tag
              method: GET
              description: "Get a specific tag"
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Tag ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: authors
          path: /users
          description: "Authors and contributors"
          operations:
            - name: list-authors
              method: GET
              description: "List TechCrunch authors and contributors"
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Items per page"
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Search authors"
                - name: who
                  in: query
                  type: string
                  required: false
                  description: "Filter to authors only"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-author
              method: GET
              description: "Get a specific author"
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Author ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: media
          path: /media
          description: "Media attachments and images"
          operations:
            - name: list-media
              method: GET
              description: "List media attachments"
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Items per page"
                - name: media_type
                  in: query
                  type: string
                  required: false
                  description: "Filter by media type"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-media
              method: GET
              description: "Get a specific media item"
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Media ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: search
          path: /search
          description: "Full-text content search"
          operations:
            - name: search-content
              method: GET
              description: "Search across all TechCrunch content"
              inputParameters:
                - name: search
                  in: query
                  type: string
                  required: true
                  description: "Search query"
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Items per page"
                - name: type
                  in: query
                  type: string
                  required: false
                  description: "Content type filter"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: techcrunch-rest
      resources:
        - path: /v1/posts
          name: posts
          description: "TechCrunch posts"
          operations:
            - method: GET
              name: list-posts
              description: "List TechCrunch posts"
              call: "techcrunch-wp.list-posts"
              with:
                search: "rest.search"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/posts/{id}
          name: post
          description: "Single post"
          operations:
            - method: GET
              name: get-post
              description: "Get a TechCrunch post"
              call: "techcrunch-wp.get-post"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/categories
          name: categories
          description: "Content categories"
          operations:
            - method: GET
              name: list-categories
              description: "List categories"
              call: "techcrunch-wp.list-categories"
              with:
                search: "rest.search"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/search
          name: search
          description: "Content search"
          operations:
            - method: GET
              name: search-content
              description: "Search TechCrunch content"
              call: "techcrunch-wp.search-content"
              with:
                search: "rest.search"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: techcrunch-mcp
      transport: http
      tools:
        - name: list-posts
          description: "List TechCrunch articles with optional filters"
          hints:
            readOnly: true
            openWorld: true
          call: "techcrunch-wp.list-posts"
          with:
            search: "tools.search"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-post
          description: "Get a specific TechCrunch article by ID"
          hints:
            readOnly: true
            openWorld: false
          call: "techcrunch-wp.get-post"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-categories
          description: "List all TechCrunch content categories"
          hints:
            readOnly: true
            openWorld: true
          call: "techcrunch-wp.list-categories"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-tags
          description: "List all TechCrunch content tags"
          hints:
            readOnly: true
            openWorld: true
          call: "techcrunch-wp.list-tags"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-authors
          description: "List TechCrunch authors and contributors"
          hints:
            readOnly: true
            openWorld: true
          call: "techcrunch-wp.list-authors"
          outputParameters:
            - type: object
              mapping: "$."
        - name: search-content
          description: "Search all TechCrunch content"
          hints:
            readOnly: true
            openWorld: true
          call: "techcrunch-wp.search-content"
          with:
            search: "tools.search"
          outputParameters:
            - type: object
              mapping: "$."
