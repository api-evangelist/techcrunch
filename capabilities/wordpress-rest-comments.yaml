naftiko: 1.0.0-alpha2
info:
  label: TechCrunch WordPress REST API — Comments
  description: 'TechCrunch WordPress REST API — Comments. 2 operations. Lead operation: List Comments. Self-contained Naftiko
    capability covering one Techcrunch business surface.'
  tags:
  - Techcrunch
  - Comments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TECHCRUNCH_API_KEY: TECHCRUNCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: wordpress-rest-comments
    baseUri: https://techcrunch.com/wp-json/wp/v2
    description: TechCrunch WordPress REST API — Comments business capability. Self-contained, no shared references.
    resources:
    - name: comments
      path: /comments
      operations:
      - name: listcomments
        method: GET
        description: List Comments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: page
          in: query
          type: integer
        - name: per_page
          in: query
          type: integer
        - name: post
          in: query
          type: integer
          description: Limit result set to comments assigned to a specific post.
        - name: status
          in: query
          type: string
        - name: orderby
          in: query
          type: string
        - name: order
          in: query
          type: string
    - name: comments-id
      path: /comments/{id}
      operations:
      - name: getcomment
        method: GET
        description: Get Comment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: wordpress-rest-comments-rest
    port: 8080
    description: REST adapter for TechCrunch WordPress REST API — Comments. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/comments
      name: comments
      description: REST surface for comments.
      operations:
      - method: GET
        name: listcomments
        description: List Comments
        call: wordpress-rest-comments.listcomments
        with:
          page: rest.page
          per_page: rest.per_page
          post: rest.post
          status: rest.status
          orderby: rest.orderby
          order: rest.order
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/comments/{id}
      name: comments-id
      description: REST surface for comments-id.
      operations:
      - method: GET
        name: getcomment
        description: Get Comment
        call: wordpress-rest-comments.getcomment
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: wordpress-rest-comments-mcp
    port: 9090
    transport: http
    description: MCP adapter for TechCrunch WordPress REST API — Comments. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-comments
      description: List Comments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wordpress-rest-comments.listcomments
      with:
        page: tools.page
        per_page: tools.per_page
        post: tools.post
        status: tools.status
        orderby: tools.orderby
        order: tools.order
      outputParameters:
      - type: object
        mapping: $.
    - name: get-comment
      description: Get Comment
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wordpress-rest-comments.getcomment
      outputParameters:
      - type: object
        mapping: $.
