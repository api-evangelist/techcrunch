naftiko: 1.0.0-alpha2
info:
  label: TechCrunch WordPress REST API — Search
  description: 'TechCrunch WordPress REST API — Search. 1 operations. Lead operation: Search Content. Self-contained Naftiko
    capability covering one Techcrunch business surface.'
  tags:
  - Techcrunch
  - Search
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TECHCRUNCH_API_KEY: TECHCRUNCH_API_KEY
capability:
  consumes:
  - type: http
    namespace: wordpress-rest-search
    baseUri: https://techcrunch.com/wp-json/wp/v2
    description: TechCrunch WordPress REST API — Search business capability. Self-contained, no shared references.
    resources:
    - name: search
      path: /search
      operations:
      - name: search
        method: GET
        description: Search Content
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: search
          in: query
          type: string
          description: Limit results to those matching a string.
          required: true
        - name: page
          in: query
          type: integer
        - name: per_page
          in: query
          type: integer
        - name: type
          in: query
          type: string
          description: Limit result set to items of an object type.
        - name: subtype
          in: query
          type: string
          description: Limit result set to items with a given object subtype.
  exposes:
  - type: rest
    namespace: wordpress-rest-search-rest
    port: 8080
    description: REST adapter for TechCrunch WordPress REST API — Search. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/search
      name: search
      description: REST surface for search.
      operations:
      - method: GET
        name: search
        description: Search Content
        call: wordpress-rest-search.search
        with:
          search: rest.search
          page: rest.page
          per_page: rest.per_page
          type: rest.type
          subtype: rest.subtype
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: wordpress-rest-search-mcp
    port: 9090
    transport: http
    description: MCP adapter for TechCrunch WordPress REST API — Search. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: search-content
      description: Search Content
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wordpress-rest-search.search
      with:
        search: tools.search
        page: tools.page
        per_page: tools.per_page
        type: tools.type
        subtype: tools.subtype
      outputParameters:
      - type: object
        mapping: $.
